name: DevSecOps Unified Security Scan (Python)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Detecção de Segredos e Credenciais Vazadas
  # -------------------------------------------------------------
  secret-scanning:
    name: Secret Scan (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan para detecção de segredos
        uses: trufflesecurity/trufflehog@31ce31ee1abbcc7dc8eee5764c17121c3044c8b2

  # -------------------------------------------------------------
  # JOB 2: Detecção de Segredos (Gitleaks)
  # -------------------------------------------------------------
  secret-scan-gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Gitleaks / Secret Scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # -------------------------------------------------------------
  # JOB 3: Qualidade de Sintaxe Docs (Markdown)
  # -------------------------------------------------------------
  markdown-lint:
    name: Lint Markdown Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Lint Markdown Files
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff
        with:
          globs: "**/*.md"

  # -------------------------------------------------------------
  # JOB 4: Qualidade de Código e Linters (Python)
  # -------------------------------------------------------------
  code-quality-linting:
    name: Code Quality (Flake8 & Black)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar ambiente Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Linters e Formatadores
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black

      - name: Validar Sintaxe e Boas Práticas (Flake8)
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Validar Formatação de Código (Black Check)
        run: |
          black --check --diff .

  # -------------------------------------------------------------
  # JOB 5: Auditoria Nativa de Dependências (Pip-Audit)
  # -------------------------------------------------------------
  sca-pip-audit:
    name: SCA (Pip-Audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar ambiente Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Dependências e Pip-Audit
        run: |
          python -m pip install --upgrade pip "setuptools>=83.0.0"
          pip install pip-audit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Auditoria de Segurança de Dependências
        run: pip-audit

  # -------------------------------------------------------------
  # JOB 6: SAST Especializado em Python (Bandit)
  # -------------------------------------------------------------
  sast-bandit:
    name: SAST (Bandit Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar ambiente Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar e Executar Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit
          bandit -r . -x ./tests,./venv -ll

  # -------------------------------------------------------------
  # JOB 7: SAST Avançado com CodeQL
  # -------------------------------------------------------------
  sast-codeql:
    name: SAST (CodeQL Analysis)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          languages: python
          queries: security-extended,security-and-quality

      - name: Executar Análise CodeQL
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: "/language:python"

  # -------------------------------------------------------------
  # JOB 8: SAST Open Source com Horusec (Corrigido)
  # -------------------------------------------------------------
  sast-horusec:
    name: SAST (Horusec)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Horusec Security Scan
        run: |
          curl -fsSL https://raw.githubusercontent.com/ZupIT/horusec/main/deployments/scripts/install.sh -o install_horusec.sh
          bash install_horusec.sh latest
          rm -f install_horusec.sh
          horusec start -p="./" --config-file-path="./.horusec-config.json" -D -I -e="false" -o="sarif" -O="./horusec-results.sarif" || true

      - name: Tratar e Validar SARIF do Horusec
        if: always()
        run: |
          if [ ! -s "horusec-results.sarif" ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemas/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Horusec","rules":[{"id":"HORUSEC-FALLBACK","name":"FallbackRule","shortDescription":{"text":"Fallback rule for empty results"}}]},"invocations":[{"executionSuccessful":true}],"results":[]}]}' > horusec-results.sarif
          fi

      - name: Upload Horusec SARIF report
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always()
        with:
          sarif_file: horusec-results.sarif
          category: Horusec

  # -------------------------------------------------------------
  # JOB 9: SAST Rápido baseado em Regras com Semgrep
  # -------------------------------------------------------------
  sast-semgrep:
    name: SAST (Semgrep Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Executar Semgrep Scan
        run: |
          semgrep scan \
            --config=p/python \
            --config=p/owasp-top-ten \
            --sarif \
            --output=semgrep.sarif \
            || true

      - name: Validar e Garantir Estrutura SARIF do Semgrep
        if: always()
        run: |
          if [ ! -s "semgrep.sarif" ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemas/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Semgrep","rules":[]}},"results":[]}]}' > semgrep.sarif
          fi

      - name: Upload do Relatório SARIF do Semgrep
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: Semgrep

  # -------------------------------------------------------------
  # JOB 10: Análise de Dependências de Software com OSV-Scanner
  # -------------------------------------------------------------
  sca-osv:
    name: SCA (OSV-Scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36

  # -------------------------------------------------------------
  # JOB 11: Análise de Dependências e Misconfigurations com Trivy (Corrigido)
  # -------------------------------------------------------------
  sca-trivy:
    name: SCA & Misconfig (Trivy Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Executar Varredura Trivy (Repository)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: '0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tratar e Validar SARIF do Trivy
        if: always()
        run: |
          if [ ! -s "trivy-results.sarif" ]; then
            echo '{"$schema":"https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemas/sarif-schema-2.1.0.json","version":"2.1.0","runs":[{"tool":{"driver":{"name":"Trivy","rules":[]}},"results":[]}]}' > trivy-results.sarif
          fi

      - name: Upload do Relatório SARIF do Trivy
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
          category: Trivy

  # -------------------------------------------------------------
  # JOB 12: Validação de Integridade Estrutural do Projeto Python
  # -------------------------------------------------------------
  python-structure-check:
    name: Validate Python Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validar arquivos essenciais do ecossistema Python
        run: |
          if [ ! -f "requirements.txt" ] && [ ! -f "pyproject.toml" ] && [ ! -f "Pipfile" ]; then
            echo "❌ ERRO: Nenhum arquivo de gerenciamento de dependências (requirements.txt, pyproject.toml ou Pipfile) foi encontrado!"
            exit 1
          fi

          test -f README.md || (echo "❌ README.md não encontrado!" && exit 1)
          echo "✅ Estrutura básica do repositório Python validada."

  # -------------------------------------------------------------
  # JOB 13: Publicação e Build de Artefatos Python
  # -------------------------------------------------------------
  build-artifact:
    name: Bundle & Upload Artifact
    needs:
      [
        secret-scanning,
        secret-scan-gitleaks,
        markdown-lint,
        code-quality-linting,
        sca-pip-audit,
        sast-bandit,
        sast-codeql,
        sast-horusec,
        sast-semgrep,
        sca-osv,
        sca-trivy,
        python-structure-check,
      ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configurar ambiente Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.11"

      - name: Gerar pacote redistribuível
        run: |
          python -m pip install --upgrade pip build
          if [ -f pyproject.toml ] || [ -f setup.py ]; then
            python -m build
          else
            mkdir -p build_artifact
            cp -r devsecops_scanner.py requirements.txt README.md build_artifact/
          fi

      - name: Subir Artefato de Build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: python-app-build
          path: build_artifact/
          retention-days: 7
          if-no-files-found: error
